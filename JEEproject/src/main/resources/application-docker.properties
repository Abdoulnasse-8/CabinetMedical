# Profile "docker" — utilisé à l'intérieur du container mini-heroku (add-on PostgreSQL)
server.port=${PORT:8080}

# PostgreSQL (valeurs injectées via les variables d'environnement de l'app)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cabinet_medical}
spring.datasource.username=${JDBC_DATABASE_USER:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# CORS — origine du frontend déployé sur mini-heroku
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}